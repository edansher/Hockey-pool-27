openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Hockey Pool API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: pool
  - name: players
  - name: transactions
  - name: admin
  - name: public
  - name: draft
paths:
  /poll/daily:
    get:
      operationId: getDailyPoolPolls
      tags: [pool]
      responses:
        "200":
          description: Today and yesterday in Toronto, with participant voting state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyPoolPolls"
  /poll/popup:
    post:
      operationId: claimPoolPollPopup
      tags: [pool]
      responses:
        "200":
          description: Atomically reserve the one-time popup for this participant
          content:
            application/json:
              schema:
                type: object
                required: [poll]
                properties:
                  poll:
                    anyOf:
                      - $ref: "#/components/schemas/PoolPoll"
                      - type: "null"
  /poll/admin:
    get:
      operationId: getAdminPoolPolls
      tags: [admin]
      responses:
        "200":
          description: Administrator-only drafts and saved polls
          content:
            application/json:
              schema:
                type: object
                required: [polls]
                properties:
                  polls:
                    type: array
                    items: { $ref: "#/components/schemas/PoolPoll" }
  /poll/admin/drafts:
    post:
      operationId: savePoolPollDraft
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PoolPollDraft" }
      responses:
        "200":
          description: Saved draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PoolPoll" }
  /poll/admin/preview:
    post:
      operationId: previewPoolPoll
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PoolPollDraft" }
      responses:
        "200":
          description: Admin-only unsaved preview; no participant visibility
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PoolPoll" }
  /poll/admin/edit:
    post:
      operationId: updatePoolPoll
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PoolPollDraft" }
      responses:
        "200":
          description: Updated poll; saved votes and publication date preserved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PoolPoll" }
  /poll/admin/delete:
    post:
      operationId: deletePoolPoll
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PoolPollRemoval" }
      responses:
        "200":
          description: Poll removed from participant and administrator views
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PoolPollRemovalResult" }
  /poll/admin/publish:
    post:
      operationId: publishPoolPoll
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoolPollPublication"
      responses:
        "200":
          description: Published poll, idempotent on retries, one per Toronto day
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PoolPoll" }
  /poll:
    get:
      operationId: getPoolPoll
      tags: [pool]
      summary: Current participant poll and live anonymous aggregate results
      responses:
        "200":
          description: Poll, current results, and the signed-in participant's voting state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolPoll"
  /poll/votes:
    post:
      operationId: submitPoolPoll
      tags: [pool]
      summary: Submit one complete response per verified linked participant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoolPollSubmission"
      responses:
        "200":
          description: Saved response and current results; duplicate submissions return the original response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolPoll"
        "400":
          description: Incomplete or invalid answers
        "401":
          description: Sign-in required
        "403":
          description: Verified linked participant required
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /nhl-source:
    get:
      operationId: getNhlSource
      tags: [pool]
      summary: Official NHL scores and source refresh status
      description: Server refreshes official NHL scores and eligible game statistics every five minutes. Returns persisted source facts, not calculated pool points. Failed updates retain the last successful snapshot and explicitly mark it stale.
      responses:
        "200":
          description: Source lifecycle and actual current/previous Toronto-day games
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhlSourceSnapshot"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [pool]
      summary: Current pool dashboard
      responses:
        "200":
          description: Dashboard and pool status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /pool-scoring:
    get:
      operationId: getPoolScoring
      tags: [pool]
      summary: Persisted live NHL-to-pool scoring snapshot
      description: Returns stable owner/round rows for the 2026–27 regular season. Statistics are derived from official NHL gamecenter boxscores and play-by-play using the persisted current pool scoring rules. Incomplete source coverage is explicitly represented; unavailable values are null, never inferred zeroes.
      responses:
        "200":
          description: Pool scoring rows and official source coverage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolScoringSnapshot"
  /pool-injuries:
    get:
      operationId: getPoolInjuries
      tags: [pool]
      summary: Current NHL injury reports for all identified pool players
      description: Refreshed daily at 8 AM America/Toronto from official NHL sources. Unknown identities and unreported injuries remain explicit; absence and roster activity are not injury evidence.
      responses:
        "200":
          description: Injury snapshot and source refresh status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolInjurySnapshot"
  /standings:
    get:
      operationId: getStandings
      tags: [pool]
      summary: Standings for the current or selected Toronto calendar date
      parameters:
        - in: query
          name: date
          schema: { type: string, format: date }
      responses:
        "200":
          description: Current or requested standings with explicit scoring availability; unknown totals are null, never invented zeroes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandingsSnapshot"
  /owners:
    get:
      operationId: getOwners
      tags: [pool]
      summary: List pool owners and current summary totals
      responses:
        "200":
          description: Pool owners
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OwnerStanding" }
  /draft-rosters:
    get:
      operationId: getDraftRosters
      tags: [draft]
      summary: Imported original draft-board selections
      responses:
        "200":
          description: Persisted draft rosters with original source labels
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DraftRoster" }
  /owners/{ownerId}:
    get:
      operationId: getOwner
      tags: [pool]
      summary: Owner roster and season summary
      parameters:
        - in: path
          name: ownerId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Owner and roster
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerDetail" }
        "404": { description: Owner not found }
  /players:
    get:
      operationId: getPlayers
      tags: [players]
      summary: Search the NHL player pool, including undrafted players
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: team
          schema: { type: string }
        - in: query
          name: position
          schema: { type: string, enum: [F, D, G] }
        - in: query
          name: available
          schema: { type: boolean }
        - in: query
          name: sort
          schema:
            type: string
            enum: [name, team, position, gamesPlayed, poolPoints, goals, assists, lastGamePoints]
        - in: query
          name: direction
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: Filtered player records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlayerSummary" }
  /available-players:
    get:
      operationId: getAvailablePlayers
      tags: [players]
      summary: All undrafted NHL players ranked by current pool scoring rules
      description: Includes individual skaters and goalies. Points are calculated from verified per-game NHL facts using the currently saved pool scoring rules; incomplete rows are ranked by known points and explicitly marked.
      responses:
        "200":
          description: Available NHL player catalog and scoring coverage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailablePlayersSnapshot"
  /players/{playerId}:
    get:
      operationId: getPlayer
      tags: [players]
      summary: Player profile, game log, ownership and transaction history
      parameters:
        - in: path
          name: playerId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Player profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerProfile" }
        "404": { description: Player not found }
  /transaction-access:
    get:
      operationId: getTransactionAccess
      tags: [transactions]
      summary: Current verified account's authorized rosters and active skaters, without email mappings
      responses:
        "200":
          description: Private account access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionAccess" }
  /transaction-summary:
    get:
      operationId: getTransactionSummary
      tags: [transactions]
      summary: Backend-calculated pool earnings and participant transaction counters
      responses:
        "200":
          description: Pool transaction accounting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionSummary" }
  /admin/transactions/{id}/payment:
    patch:
      operationId: updateTransactionPayment
      tags: [admin]
      summary: Administrator records or corrects receipt of a completed drop fee
      security: [{ clerkSession: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionPaymentUpdate" }
      responses:
        "200":
          description: Saved transaction payment status; swap details are unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "400": { description: Invalid payment status }
        "401": { description: Sign-in required }
        "403": { description: Verified pool administrator required }
        "404": { description: Transaction not found }
  /transactions:
    get:
      operationId: getTransactions
      tags: [transactions]
      summary: Immutable transaction history
      responses:
        "200":
          description: Transaction ledger
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Transaction" }
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Atomically record a skater drop/pickup; goalies cannot be dropped or traded
      security: [{ clerkSession: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Reuse this key for retries; one key can record only one swap and one charge.
          schema: { type: string, minLength: 8, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionInput" }
      responses:
        "201":
          description: Transaction committed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "400": { description: Invalid input or forbidden goalie transaction }
        "401": { description: Sign-in required }
        "403": { description: Verified linked participant may act only for its own roster; administrators retain all-roster access }
        "409": { description: "Transaction limit, availability, or roster rule violated" }
        "503": { description: Verified scoring unavailable; retry safely with the same request key }
  /transactions/preview:
    post:
      operationId: previewTransaction
      tags: [pool]
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionInput" }
      responses:
        "200":
          description: Server-verified transaction and game eligibility
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionPreview" }
        "403": { description: Linked roster required }
        "409": { description: Roster or availability changed }
  /auth/config:
    get:
      operationId: getAuthConfig
      tags: [pool]
      responses:
        "200":
          description: Public authentication configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  publishableKey: { type: string }
                required: [publishableKey]
  /admin/manage:
    get:
      operationId: getAdminManagement
      tags: [admin]
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Private administrator accounts, rosters, transactions and audit trail
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts: { type: array, items: { type: object, additionalProperties: true } }
                  rosters: { type: array, items: { $ref: "#/components/schemas/DraftRoster" } }
                  transactions: { type: array, items: { $ref: "#/components/schemas/Transaction" } }
                  audit: { type: array, items: { type: object, additionalProperties: true } }
                required: [accounts, rosters, transactions, audit]
        "403": { description: Administrator required }
    post:
      operationId: managePool
      tags: [admin]
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PoolManagementInput" }
      responses:
        "200":
          description: Saved operation; refresh all affected views
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { description: Invalid correction }
        "403": { description: Administrator required }
        "409": { description: Conflicting correction; nothing saved }
  /scoring-rules:
    get:
      operationId: getScoringRules
      tags: [pool]
      summary: Current pool scoring rules
      responses:
        "200":
          description: Scoring configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScoringRules" }
    patch:
      operationId: updateScoringRules
      tags: [admin]
      summary: Admin-only scoring-rule update with revision protection
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScoringRulesUpdate" }
      responses:
        "200":
          description: Updated scoring rules
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScoringRules" }
        "401": { description: Sign in required }
        "403": { description: Administrator access required }
        "400": { description: Invalid scoring rules }
        "409": { description: Rules changed or an ownership cutoff cannot be safely repriced }
  /import-review:
    get:
      operationId: getImportReview
      tags: [admin]
      summary: Opening roster import matches and unresolved selections
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Draft board import review
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ImportSelection" }
        "403": { description: Administrator access required }
  /import-review/{selectionId}:
    patch:
      operationId: updateImportSelection
      tags: [admin]
      summary: Confirm or correct one opening selection
      security: [{ clerkSession: [] }]
      parameters:
        - in: path
          name: selectionId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportSelectionUpdate" }
      responses:
        "200":
          description: Updated import selection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportSelection" }
        "403": { description: Administrator access required }
        "404": { description: Selection not found }
  /admin/reports/health:
    get:
      operationId: getDailyReportHealth
      tags: [pool]
      summary: Private administrator morning report health, including database outages
      responses:
        "200":
          description: Current publication health; unknown timestamps are explicitly null
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyReportHealth" }
        "401": { description: Sign-in required }
        "403": { description: Administrator access required }
  /reports:
    get:
      operationId: getDailyReportHistory
      tags: [pool]
      summary: Saved published daily reports, newest first
      responses:
        "200":
          description: Published report history
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DailyReportHistoryItem" } }
  /reports/{date}:
    get:
      operationId: getPublishedDailyReport
      tags: [pool]
      summary: Daily report by publication date in Toronto
      parameters:
        - in: path
          name: date
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Saved report or explicit waiting status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyReportResponse" }
        "400": { description: Invalid date }
  /analysis/{date}:
    get:
      operationId: getDailyAnalysis
      tags: [pool]
      summary: Verified daily pool analysis for a Toronto calendar date
      parameters:
        - in: path
          name: date
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Daily analysis and scoring detail, including explicit pending or unavailable source status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyAnalysis" }
        "400": { description: Invalid YYYY-MM-DD calendar date }
  /daily-scoring/{date}:
    get:
      operationId: getDailyScoring
      tags: [pool]
      summary: Sortable player scoring rows for a Toronto calendar date
      parameters:
        - in: path
          name: date
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Verified player-by-player score breakdown
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DailyScoringRow" }
        "400": { description: Invalid YYYY-MM-DD calendar date }
        "503": { description: Official scoring source is unavailable; no scoring or zero-point result can be inferred }
  /shares:
    post:
      operationId: createShare
      tags: [public]
      summary: Create a read-only share link for a supported pool view
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareInput" }
      responses:
        "201":
          description: Share link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareLink" }
  /public/{shareId}:
    get:
      operationId: getPublicShare
      tags: [public]
      summary: Public read-only shared pool view
      parameters:
        - in: path
          name: shareId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Shared view; contains no administrative actions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicShare" }
        "404": { description: Share link not found }
  /admin/access:
    get:
      operationId: getAdminAccess
      tags: [admin]
      summary: Check whether the signed-in account is authorized to administer this pool
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Authorization result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAccess" }
  /admin/participant-emails:
    get:
      operationId: getAdminParticipantEmails
      tags: [admin]
      summary: Private participant email directory for the verified pool administrator
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Configured backend account links, not account creation or verification status
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminParticipantEmail" }
        "401": { description: Sign-in required }
        "403": { description: Verified pool administrator required }
  /participant/access:
    get:
      operationId: getParticipantAccess
      tags: [participants]
      summary: Check the signed-in account's verified roster link and admin status
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Private account access result; no participant email directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParticipantAccess" }
components:
  securitySchemes:
    clerkSession:
      type: http
      scheme: cookie
  schemas:
    PoolPollAnswers:
      type: object
      additionalProperties: { type: string }
    PoolPollDraft:
      type: object
      required: [title, questions]
      properties:
        id: { type: string }
        title: { type: string }
        questions:
          type: array
          items:
            type: object
            required: [id, prompt, options]
            properties:
              id: { type: string }
              prompt: { type: string }
              options:
                type: array
                items:
                  type: object
                  required: [id, label]
                  properties:
                    id: { type: string }
                    label: { type: string }
    PoolPollPublication:
      type: object
      required: [pollId]
      properties:
        pollId: { type: string }
    PoolPollRemoval:
      type: object
      required: [pollId]
      properties:
        pollId: { type: string }
    PoolPollRemovalResult:
      type: object
      required: [pollId, deleted]
      properties:
        pollId: { type: string }
        deleted: { type: boolean }
    PoolPollParticipant:
      type: object
      required: [name]
      properties:
        name: { type: string }
    DailyPoolPolls:
      type: object
      required: [today, yesterday, serverNow, rollsOverAt, polls]
      properties:
        today: { type: string }
        yesterday: { type: string }
        serverNow: { type: string }
        rollsOverAt: { type: string }
        polls:
          type: array
          items: { $ref: "#/components/schemas/PoolPoll" }
    PoolPollSubmission:
      type: object
      additionalProperties: false
      required: [pollId, answers]
      properties:
        pollId:
          type: string
        answers:
          $ref: "#/components/schemas/PoolPollAnswers"
    PoolPoll:
      type: object
      required: [id, title, questions, respondentCount, canVote, hasVoted, myAnswers, participants, structureLocked]
      properties:
        id:
          type: string
        title:
          type: string
        publicationDate: { type: ["string", "null"] }
        publishedAt: { type: ["string", "null"] }
        closesAt: { type: ["string", "null"] }
        status: { type: string, enum: [draft, published] }
        isOpen: { type: boolean }
        popupViewed: { type: boolean }
        eligibleParticipantCount: { type: integer }
        legacy: { type: boolean }
        respondentCount:
          type: integer
        participants:
          type: array
          items: { $ref: "#/components/schemas/PoolPollParticipant" }
        structureLocked:
          type: boolean
        canVote:
          type: boolean
        hasVoted:
          type: boolean
        myAnswers:
          anyOf:
            - $ref: "#/components/schemas/PoolPollAnswers"
            - type: "null"
        questions:
          type: array
          items:
            type: object
            required: [id, prompt, options]
            properties:
              id:
                type: string
              prompt:
                type: string
              options:
                type: array
                items:
                  type: object
                  required: [id, label, votes, percentage]
                  properties:
                    id:
                      type: string
                    label:
                      type: string
                    votes:
                      type: integer
                    percentage:
                      type: number
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    OwnerStanding:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        rank: { type: ["integer", "null"] }
        previousRank: { type: ["integer", "null"] }
        rankMovement: { type: integer }
        seasonPoints: { type: number }
        yesterdayPoints: { type: number }
        livePoints: { type: number }
        gamesPlayed: { type: integer }
        pointsPerGame: { type: number }
        transactionsUsed: { type: integer }
        rosterComplete: { type: boolean }
      required: [id, name, rank, previousRank, rankMovement, seasonPoints, yesterdayPoints, livePoints, gamesPlayed, pointsPerGame, transactionsUsed, rosterComplete]
    StandingsSnapshot:
      type: object
      properties:
